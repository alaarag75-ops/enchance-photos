<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحسين وتعديل الصور الخارقة | Smart Image Enhancer</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1a2332 0%, #0d1117 100%);
            color: #c9d1d9;
        }
        
        .neon-border {
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .custom-range {
            accent-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 md:p-6">

    <!-- Header -->
    <header class="w-full max-w-5xl bg-[#161b22]/90 backdrop-blur border border-[#30363d] rounded-2xl p-4 mb-6 shadow-xl flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg text-white text-2xl font-black">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-white">استوديو تحسين الصور الذكي</h1>
                <p class="text-xs text-gray-400">تحسين تلقائي بالذكاء الاصطناعي + أداة تعديل احترافية</p>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sidebar Controls -->
        <section class="lg:col-span-5 bg-[#161b22] border border-[#30363d] rounded-2xl p-5 shadow-2xl flex flex-col gap-4">
            
            <!-- Upload Box -->
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-2">رفع صورة جديدة:</label>
                <input type="file" id="fileInput" accept="image/*" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer bg-[#0d1117] border border-[#30363d] rounded-xl p-1">
            </div>

            <!-- Auto AI Enhance Button -->
            <button onclick="aiAutoEnhance()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-extrabold py-3 rounded-xl text-xs md:text-sm shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95">
                <i class="fa-solid fa-bolt text-lg"></i> تحسين تلقائي ذكي (Smart Auto AI)
            </button>

            <!-- Quick Preset Filters -->
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">فلاتر سريعة:</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="applyPreset('cyberpunk')" class="bg-[#21262d] hover:bg-[#30363d] text-cyan-400 border border-cyan-500/30 rounded-lg py-1.5 text-xs font-bold">Cyberpunk</button>
                    <button onclick="applyPreset('anime')" class="bg-[#21262d] hover:bg-[#30363d] text-pink-400 border border-pink-500/30 rounded-lg py-1.5 text-xs font-bold">Anime Pop</button>
                    <button onclick="applyPreset('hd')" class="bg-[#21262d] hover:bg-[#30363d] text-emerald-400 border border-emerald-500/30 rounded-lg py-1.5 text-xs font-bold">HDR Clear</button>
                </div>
            </div>

            <hr class="border-[#30363d]">

            <!-- Manual Adjustments -->
            <div class="space-y-3">
                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>السطوع (Brightness)</span>
                        <span id="v-brightness" class="text-blue-400 font-mono">100%</span>
                    </div>
                    <input type="range" id="brightness" min="0" max="200" value="100" class="w-full custom-range" oninput="updateFilters()">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>التباين والوضوح (Contrast)</span>
                        <span id="v-contrast" class="text-blue-400 font-mono">100%</span>
                    </div>
                    <input type="range" id="contrast" min="0" max="200" value="100" class="w-full custom-range" oninput="updateFilters()">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>تشبع الألوان (Saturation)</span>
                        <span id="v-[#saturate]" class="text-blue-400 font-mono">100%</span>
                    </div>
                    <input type="range" id="saturate" min="0" max="250" value="100" class="w-full custom-range" oninput="updateFilters()">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span>الحدة والنعومة (Sharpen / Blur)</span>
                        <span id="v-blur" class="text-blue-400 font-mono">0px</span>
                    </div>
                    <input type="range" id="blur" min="0" max="8" value="0" step="0.5" class="w-full custom-range" oninput="updateFilters()">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="resetAll()" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2.5 rounded-xl text-xs transition">إعادة ضبط</button>
                <button onclick="downloadImage()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-download"></i> تحميل HD
                </button>
            </div>

        </section>

        <!-- Image Display Canvas -->
        <section class="lg:col-span-7 bg-[#161b22] border border-[#30363d] rounded-2xl p-4 flex flex-col items-center justify-center min-h-[420px] shadow-2xl relative overflow-hidden">
            <canvas id="mainCanvas" class="max-w-full max-h-[500px] rounded-xl shadow-2xl hidden"></canvas>
            
            <div id="uploadPlaceholder" class="text-center text-gray-500">
                <i class="fa-solid fa-cloud-arrow-up text-6xl mb-3 block opacity-30 animate-bounce"></i>
                <p class="text-sm font-bold">قم برفع أي صورة لتشغيل أداة التحسين فوراً</p>
            </div>
        </section>

    </main>

    <!-- JS Logic -->
    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('uploadPlaceholder');

        let originalImage = new Image();
        let isLoaded = false;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        canvas.width = originalImage.width;
                        canvas.height = originalImage.height;
                        canvas.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                        isLoaded = true;
                        resetAll();
                    };
                    originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function updateFilters() {
            if (!isLoaded) return;

            const b = document.getElementById('brightness').value;
            const c = document.getElementById('contrast').value;
            const s = document.getElementById('saturate').value;
            const blur = document.getElementById('blur').value;

            document.getElementById('v-brightness').innerText = b + '%';
            document.getElementById('v-contrast').innerText = c + '%';
            document.getElementById('v-blur').innerText = blur + 'px';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${blur}px)`;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
        }

        // الذكاء الاصطناعي الذكي للتحسين المباشر (Smart Auto AI)
        function aiAutoEnhance() {
            if (!isLoaded) return;
            
            // قيم خوارزمية محسنة لرفع دقة ووضوح الألوان فوراً
            document.getElementById('brightness').value = 112;
            document.getElementById('contrast').value = 125;
            document.getElementById('saturate').value = 135;
            document.getElementById('blur').value = 0;

            updateFilters();
        }

        function applyPreset(type) {
            if (!isLoaded) return;

            if (type === 'cyberpunk') {
                document.getElementById('brightness').value = 105;
                document.getElementById('contrast').value = 140;
                document.getElementById('saturate').value = 180;
            } else if (type === 'anime') {
                document.getElementById('brightness').value = 115;
                document.getElementById('contrast').value = 110;
                document.getElementById('saturate').value = 160;
            } else if (type === 'hd') {
                document.getElementById('brightness').value = 108;
                document.getElementById('contrast').value = 130;
                document.getElementById('saturate').value = 115;
            }
            updateFilters();
        }

        function resetAll() {
            if (!isLoaded) return;
            document.getElementById('brightness').value = 100;
            document.getElementById('contrast').value = 100;
            document.getElementById('saturate').value = 100;
            document.getElementById('blur').value = 0;
            updateFilters();
        }

        function downloadImage() {
            if (!isLoaded) return;
            const link = document.createElement('a');
            link.download = 'enhanced-image.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
